<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oyangoren Printing Services – File Upload System</title>
    <meta name="description" content="Fast, secure mobile-first file upload system for walk-in and remote printing customers of Oyangoren Printing Services." />
    <meta property="og:title" content="Oyangoren Printing Services – File Upload System" />
    <meta property="og:description" content="Fast, secure mobile-first file upload system for walk-in and remote printing customers of Oyangoren Printing Services." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('oyangoren_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
